name: Publish installable APK
on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact from completed build
        uses: actions/download-artifact@v4
        with:
          name: Learn-Languages-Android-APK
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish public APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.event.workflow_run.head_sha }}
          name: Learn Languages Android APK
          body: |
            Install the Learn Languages Android app.
            Download app-debug.apk below and open it on your Android phone.
          files: release/app-debug.apk
          make_latest: true
