name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify WhatsApp share link
        run: |
          node - <<'NODE'
          const project = "https://github.com/elsaydelswaf2-crypto/swaf77-";
          const message = "تعرف على تطبيق Türkçe Akademi لتعلم التركية بالعربية: " + project;
          const share = new URL("https://wa.me/?text=" + encodeURIComponent(message));
          if (share.hostname !== "wa.me" || !share.searchParams.get("text")?.includes(project)) {
            throw new Error("WhatsApp share URL is invalid");
          }
          console.log("WhatsApp share URL valid:", share.toString());
          NODE
          curl -sSL --max-time 25 -o /dev/null -w "WhatsApp endpoint HTTP %{http_code}\n" "https://wa.me/?text=Turkce%20Akademi%20https%3A%2F%2Fgithub.com%2Felsaydelswaf2-crypto%2Fswaf77-" || echo "WhatsApp endpoint could not be reached from the build runner."

      - name: Generate offline Turkish pronunciation files
        run: |
          python3 -m pip install --disable-pip-version-check piper-tts
          mkdir -p models
          curl -fL --retry 3 -o models/tr_TR-fahrettin-medium.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/1af0d6b01d3dbe698a426f0c3424650ef77fc131/tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium.onnx"
          curl -fL --retry 3 -o models/tr_TR-fahrettin-medium.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/1af0d6b01d3dbe698a426f0c3424650ef77fc131/tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium.onnx.json"
          python3 scripts/generate_turkish_audio.py

      - name: Prepare Capacitor Android project
        run: |
          mkdir -p www
          cp index.html app.js style.css manifest.webmanifest sw.js www/
          if [ -d audio ]; then cp -R audio www/audio; fi
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Türkçe Akademi" com.turkce.akademi --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Turkce-Akademi-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
