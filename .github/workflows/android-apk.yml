name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMAN" --licenses || true
          "$SDKMAN" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate application sources
        run: |
          node --check app.js
          python3 -m py_compile scripts/generate_turkish_audio.py scripts/validate_curriculum.py
          python3 scripts/validate_curriculum.py

      - name: Verify no external share functionality
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const app = fs.readFileSync("app.js", "utf8");
          const html = fs.readFileSync("index.html", "utf8");
          for (const forbidden of ["wa.me/", "navigator.share", "mailto:", "copyShare", "shareApp"]) {
            if (app.includes(forbidden) || html.includes(forbidden)) throw new Error("External sharing remains: " + forbidden);
          }
          console.log("No external share entry points remain.");
          NODE

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MP3 encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate offline Turkish pronunciation files
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check piper-tts
          mkdir -p models
          curl -fL --retry 3 -o models/tr_TR-fahrettin-medium.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/1af0d6b01d3dbe698a426f0c3424650ef77fc131/tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium.onnx"
          curl -fL --retry 3 -o models/tr_TR-fahrettin-medium.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/1af0d6b01d3dbe698a426f0c3424650ef77fc131/tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium.onnx.json"
          .venv/bin/python scripts/generate_turkish_audio.py

      - name: Prepare Capacitor Android project
        run: |
          mkdir -p www
          cp index.html app.js style.css manifest.webmanifest sw.js www/
          if [ -d audio ]; then cp -R audio www/audio; fi
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "تعلم لغات" com.turkce.akademi.v3 --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Configure permanent Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-signing.jks
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'signingConfigs {' in s:
              raise SystemExit('Unexpected existing signingConfigs; refusing unsafe duplicate edit')
          signing = """
          signingConfigs {
              release {
                  storeFile file("release-signing.jks")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          }
          """.strip()
          s, n = re.subn(r'(\n\s*buildTypes\s*\{)', lambda m: '\n' + signing + '\n' + m.group(1), s, count=1)
          if n != 1:
              raise SystemExit('Could not safely insert signingConfigs block')
          s, n = re.subn(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
          if n != 1:
              raise SystemExit('Could not safely attach release signing config')
          s, n = re.subn(r'(defaultConfig\s*\{[^}]*?versionCode\s+)\d+', lambda m: m.group(1) + os.environ['ANDROID_VERSION_CODE'], s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not safely set monotonic versionCode')
          p.write_text(s)
          PY
          keytool -list -keystore android/app/release-signing.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -keypass "$ANDROID_KEY_PASSWORD"

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify release APK signature and package
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.turkce.akademi.v3'"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Learn-Languages-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: Learn-Languages-Android-APK
          path: release
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.sha }}
          name: Learn Languages Android APK
          body: |
            Beginner learning app with Turkish, English, and Arabic courses.
            Download app-release.apk and install on Android. Future updates use the same release signing key.
          files: release/app-release.apk
          make_latest: true
