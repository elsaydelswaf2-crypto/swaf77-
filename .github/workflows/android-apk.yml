name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate application sources
        run: |
          node --check app.js
          python3 -m py_compile scripts/generate_turkish_audio.py scripts/validate_curriculum.py
          python3 scripts/validate_curriculum.py

      - name: Verify copy-only privacy controls
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const app = fs.readFileSync("app.js", "utf8");
          const html = fs.readFileSync("index.html", "utf8");
          for (const forbidden of ["navigator.share", "mailto:", "https://wa.me/", "shareApp"]) {
            if (app.includes(forbidden) || html.includes(forbidden)) throw new Error("Forbidden share entry point: " + forbidden);
          }
          if (!app.includes('navigator.clipboard.writeText(url)') || !app.includes('document.execCommand("copy")')) {
            throw new Error("Copy-link action or Android fallback is missing");
          }
          console.log("Copy-only sharing verified; no email or external share intent.");
          NODE

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate offline Turkish pronunciation files
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check piper-tts
          mkdir -p models
          curl -fL --retry 3 -o models/tr_TR-fahrettin-medium.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/1af0d6b01d3dbe698a426f0c3424650ef77fc131/tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium.onnx"
          curl -fL --retry 3 -o models/tr_TR-fahrettin-medium.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/1af0d6b01d3dbe698a426f0c3424650ef77fc131/tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium.onnx.json"
          .venv/bin/python scripts/generate_turkish_audio.py

      - name: Prepare Capacitor Android project
        run: |
          mkdir -p www
          cp index.html app.js style.css manifest.webmanifest sw.js www/
          if [ -d audio ]; then cp -R audio www/audio; fi
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "تعلم لغات" com.turkce.akademi --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Learn-Languages-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
